name: Build icon pack APKs

# Manual only. Builds the three Deliverance Icons variants (heater, seal, bare), debug-signed.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build the three icon packs
        run: ./gradlew -p iconpack :pack:assembleHeaterDebug :pack:assembleSealDebug :pack:assembleBareDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: deliverance-icons-apks
          path: iconpack/pack/build/outputs/apk/*/debug/*.apk
