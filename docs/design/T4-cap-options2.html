<!doctype html><html><head><meta charset="utf-8"><title>T4 drop cap options 2</title>
<style>
@font-face{font-family:Cinzel;src:url("../../app/ui/src/main/res/font/cinzel_variable.ttf");font-weight:400 900}
@font-face{font-family:UnifrakturCook;src:url("../../app/ui/src/main/res/font/unifrakturcook_bold.ttf");font-weight:700}
body{margin:0;width:390px;background:#0d0c09;color:#a8884c;font-family:Cinzel,serif}
.l{font-size:9px;font-weight:700;letter-spacing:.2em;padding:14px 22px 2px;text-transform:uppercase}
.r{position:relative;height:96px;margin:0 22px;border-bottom:1px solid #2a2418}
.c{position:absolute;font-family:UnifrakturCook,serif;line-height:1}
.n{position:absolute;font-family:UnifrakturCook,serif;font-size:31px;line-height:1;color:#ecdfbf}
.d{position:absolute;font-size:10px;font-weight:700;letter-spacing:.2em;top:66px;white-space:nowrap}
.p{position:absolute;left:0;top:0;font-size:8.5px;font-weight:700;letter-spacing:.3em;color:#8c6d3a}
svg{position:absolute;left:0;top:0;overflow:visible}
</style></head><body><div id="o"></div>
<script>
var G='#c9a55a',GD='#8c6d3a',RD='#a8352b';
function leaf(x,y,a,s,f){return '<path transform="translate('+x+' '+y+') rotate('+a+') scale('+s+')" d="M0 0C3 -5 9 -5 12 0C9 5 3 5 0 0Z M0 0H12" fill="'+f+'" stroke="'+G+'" stroke-width=".8"/>'}
function bez(x,y,r){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+G+'"/>'}
/* acanthus-style vine running right from the cap's shoulder, over the name */
function vine(f1,f2){
 return '<svg width="300" height="96" fill="none">'+
 '<path d="M44 20C60 8 74 18 90 12S122 6 140 12" stroke="'+GD+'" stroke-width="1.2"/>'+
 '<path d="M66 14C70 6 78 6 80 12" stroke="'+GD+'" stroke-width="1"/>'+
 '<path d="M112 9C116 1 124 2 126 8" stroke="'+GD+'" stroke-width="1"/>'+
 leaf(58,14,-50,1,f1)+leaf(92,13,-70,1.05,f2)+leaf(120,8,-60,1,f1)+leaf(78,12,40,.8,f2)+leaf(104,12,50,.8,f1)+
 bez(142,12,2.2)+bez(81,6,1.6)+bez(127,3,1.6)+bez(50,17,1.6)+
 '<path d="M2 4V90M5.5 4V90" stroke="'+GD+'" stroke-width="1"/>'+
 '<path d="M38 82C34 90 24 88 24 80" stroke="'+GD+'" stroke-width="1.1"/>'+leaf(24,80,200,.9,f2)+bez(38,82,1.8)+
 '</svg>';
}
var W=[['M','onday','20th'],['W','ednesday','22nd'],['S','aturday','25th'],['T','hursday','23rd']];
var V=[
 ['D. Same blackletter, cream with oxblood shadow, gold vine and leaves growing from it, margin bar',
  '<div class="c" style="left:12px;top:14px;font-size:66px;color:#ecdfbf;text-shadow:2px 2px 0 #6a1d16,0 0 14px rgba(201,165,90,.25)">%L</div>', '#2e0c09','#5a1a14'],
 ['E. Gold-gradient blackletter, oxblood shadow, vine in oxblood and gold',
  '<div class="c" style="left:12px;top:14px;font-size:66px;color:#d9b868;background:linear-gradient(#f4dc9c,#a07a30 85%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(2px 2px 0 #6a1d16) drop-shadow(0 0 10px rgba(201,165,90,.25))">%L</div>', '#6a1d16','#2e0c09']
];
var h='';V.forEach(function(v){h+='<div class="l">'+v[0]+'</div>';W.forEach(function(w){
 var off=(w[0]=='W'||w[0]=='M')?76:62;
 h+='<div class="r"><div class="p">DAY OF PLANET</div>'+vine(v[2],v[3])+v[1].replace('%L',w[0])+'<div class="n" style="left:'+off+'px;top:30px">'+w[1]+'</div><div class="d" style="left:'+(off+2)+'px">'+w[2]+' of October</div></div>'})});
document.getElementById('o').innerHTML=h;
</script></body></html>
