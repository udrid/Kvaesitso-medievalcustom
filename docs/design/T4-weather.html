<!doctype html><html><head><meta charset="utf-8"><title>T4 weather scenes</title>
<style>
@font-face{font-family:Cinzel;src:url("../../app/ui/src/main/res/font/cinzel_variable.ttf");font-weight:400 900}
body{margin:0;width:390px;background:#0d0c09;color:#a8884c;font-family:Cinzel,serif}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:16px 22px}
.c{background:linear-gradient(#1d1a14,#12100c);border:1px solid #6b5430;padding:8px 6px 6px;text-align:center;font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.c svg{display:block;margin:0 auto 4px}
</style></head><body><div class="g" id="g"></div>
<script src="T4-weather.js"></script>
<script>var L={clear:'Clear',clearnight:'Clear night',partly:'Partly cloudy',cloudy:'Cloudy',rain:'Rain',storm:'Thunderstorm',snow:'Snow',fog:'Fog'},h='';
WX.names.forEach(function(k){h+='<div class="c">'+WX.svg(k,160,65)+L[k]+'</div>'});document.getElementById('g').innerHTML=h;</script></body></html>
