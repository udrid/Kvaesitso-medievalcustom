<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The War Room with Treasury</title>

</head>
<body>
<div>
<div>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
.node{position:absolute;width:72px;height:82px;background:none;border:0;padding:0;color:#e8dcc0}
.node svg.shield{position:absolute;inset:0}
.node .glyph{position:absolute;left:0;right:0;top:20px;display:flex;justify-content:center}
.lbl{position:absolute;width:96px;text-align:center;font-family:Cinzel,serif;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#e8dcc0}
</style>
</div>
<div style="position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;background:repeating-linear-gradient(0deg,rgba(232,220,192,.045) 0 1px,transparent 1px 39px),repeating-linear-gradient(90deg,rgba(232,220,192,.045) 0 1px,transparent 1px 39px),radial-gradient(110% 60% at 50% 38%,#2d2f34 0%,#131416 78%);font-family:'IM Fell English',Georgia,serif;color:#e8dcc0">

  <!-- camera island -->
  <div style="position:absolute;top:10px;left:50%;transform:translateX(-50%);width:214px;height:36px;box-sizing:border-box;border-radius:18px;background:#050506;border:1.5px solid #5a5f67;display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;column-gap:8px;padding:0 14px;font-size:12px">
    <span style="display:flex;align-items:center;gap:5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e58a3c" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg>Ready</span>
    <span style="width:14px;height:14px;border-radius:50%;background:#101114;border:2px solid #2a2c31"></span>
    <span style="text-align:right">77%</span>
  </div>

  <!-- date and time -->
  <div style="position:absolute;top:62px;left:20px;right:20px;display:flex;align-items:baseline;justify-content:space-between">
    <div style="font-family:Cinzel,serif;font-size:12px;letter-spacing:.22em;color:#b8ab8c">SUNDAY · 25 OCT</div>
    <div style="font-family:Cinzel,serif;font-size:30px;font-weight:700">2:04</div>
  </div>

  <!-- treasury -->
  <div style="position:absolute;top:108px;left:20px;right:20px;height:68px;box-sizing:border-box;border:2px solid #4a4e55;border-radius:6px;background:linear-gradient(170deg,#dccba2,#c9b585);box-shadow:0 3px 0 #0b0b0d;color:#20170f;display:flex;align-items:center;gap:12px;padding:0 14px">
    <span style="width:36px;height:36px;border-radius:50%;box-sizing:border-box;border:2px solid #5b4a30;background:radial-gradient(circle at 35% 30%,#e8c978,#a87f2c);display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b2a0d" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 8v8"/></svg></span>
    <div style="flex:1">
      <div style="font-family:Cinzel,serif;font-size:11px;font-weight:700;letter-spacing:.2em">TREASURY</div>
      <div style="font-family:Cinzel,serif;font-size:22px;font-weight:700;line-height:1.1">[YOUR TOTAL]</div>
    </div>
    <div style="width:104px">
      <div style="display:flex;justify-content:space-between;font-family:Cinzel,serif;font-size:10px;letter-spacing:.14em;margin-bottom:4px"><span>GOAL</span><span>[AMOUNT]</span></div>
      <div style="height:12px;box-sizing:border-box;border:2px solid #4a4e55;border-radius:3px;background:#0b0b0d;padding:1px"><div style="width:40%;height:100%;background:linear-gradient(90deg,#8a3f0c,#e58a3c);border-radius:1px"></div></div>
    </div>
  </div>

  <!-- map lines -->
  <svg width="390" height="500" viewBox="0 0 390 500" style="position:absolute;top:150px;left:0" fill="none" stroke="#6b6f77" stroke-width="1.5" stroke-dasharray="5 6" aria-hidden="true">
    <path d="M195 187L66 111M195 187L324 111M195 187L66 271M195 187L324 271"/>
    <circle cx="195" cy="187" r="120" stroke="#33353a" stroke-dasharray="2 7"/>
  </svg>

  <!-- orb ring -->
  <svg width="190" height="190" viewBox="0 0 190 190" style="position:absolute;top:242px;left:100px" fill="none" aria-hidden="true">
    <circle cx="95" cy="95" r="90" stroke="#33353a" stroke-width="1.5"/>
    <circle cx="95" cy="95" r="84" stroke="#6b6f77" stroke-width="6" stroke-dasharray="2 12"/>
  </svg>

  <!-- oracle orb -->
  <button type="button" aria-label="Claude" style="position:absolute;top:262px;left:120px;width:150px;height:150px;border-radius:50%;border:4px solid #4a4e55;background:radial-gradient(circle at 50% 40%,#3a2a1a,#0d0b09 70%);box-shadow:0 0 0 3px #0b0b0d,0 0 36px rgba(229,138,60,.28),inset 0 0 28px rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:0">
    <svg width="66" height="66" viewBox="0 0 24 24" fill="none" stroke="#e58a3c" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg>
  </button>
  <div style="position:absolute;top:420px;left:95px;width:200px;text-align:center;font-family:Cinzel,serif;font-size:13px;font-weight:700;letter-spacing:.22em">THE ORACLE</div>

  <!-- nodes -->
  <button type="button" class="node" style="top:220px;left:30px" aria-label="Twitter"><svg class="shield" viewBox="0 0 72 82" aria-hidden="true"><path d="M36 2L68 14V44C68 64 52 76 36 80C20 76 4 64 4 44V14Z" fill="#1c1d20" stroke="#4a4e55" stroke-width="3"/><circle cx="36" cy="12" r="2.5" fill="#6b6f77"/></svg><span class="glyph"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 14c3-1 5-3 6-6 2 1 4 1 6 0l5 3-4 1c0 4-3 7-8 7H6l2-3-5-2z"/></svg></span></button>
  <div class="lbl" style="top:306px;left:18px">Twitter</div>
  <button type="button" class="node" style="top:220px;left:288px" aria-label="Discord"><svg class="shield" viewBox="0 0 72 82" aria-hidden="true"><path d="M36 2L68 14V44C68 64 52 76 36 80C20 76 4 64 4 44V14Z" fill="#1c1d20" stroke="#4a4e55" stroke-width="3"/><circle cx="36" cy="12" r="2.5" fill="#6b6f77"/></svg><span class="glyph"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6 7h9v10a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V7z"/><path d="M15 9h2a2 2 0 0 1 0 5h-2"/></svg></span></button>
  <div class="lbl" style="top:306px;left:276px">Discord</div>
  <button type="button" class="node" style="top:380px;left:30px" aria-label="Videos"><svg class="shield" viewBox="0 0 72 82" aria-hidden="true"><path d="M36 2L68 14V44C68 64 52 76 36 80C20 76 4 64 4 44V14Z" fill="#1c1d20" stroke="#4a4e55" stroke-width="3"/><circle cx="36" cy="12" r="2.5" fill="#6b6f77"/></svg><span class="glyph"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg></span></button>
  <div class="lbl" style="top:466px;left:18px">Videos</div>
  <button type="button" class="node" style="top:380px;left:288px" aria-label="Messages"><svg class="shield" viewBox="0 0 72 82" aria-hidden="true"><path d="M36 2L68 14V44C68 64 52 76 36 80C20 76 4 64 4 44V14Z" fill="#1c1d20" stroke="#4a4e55" stroke-width="3"/><circle cx="36" cy="12" r="2.5" fill="#6b6f77"/></svg><span class="glyph"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg></span></button>
  <div class="lbl" style="top:466px;left:276px">Messages</div>

  <!-- command bar -->
  <div style="position:absolute;top:572px;left:20px;right:20px;height:54px;box-sizing:border-box;border:2px solid #4a4e55;border-radius:6px;background:linear-gradient(170deg,#dccba2,#c9b585);display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;color:#20170f;box-shadow:0 3px 0 #0b0b0d">
    <span style="flex:1;font-size:17px;font-style:italic;color:#4a3a24">Command the Oracle…</span>
    <button type="button" style="height:36px;padding:0 14px;border:2px solid #0b0b0d;border-radius:4px;background:#1c1d20;color:#e8dcc0;font-family:Cinzel,serif;font-size:11px;font-weight:700;letter-spacing:.14em">SUMMON</button>
  </div>

  <!-- dock -->
  <div style="position:absolute;left:20px;right:20px;bottom:22px;height:84px;box-sizing:border-box;border:2px solid #4a4e55;border-radius:14px;background:linear-gradient(180deg,#26282c,#131416);box-shadow:inset 0 0 0 1px #0b0b0d;display:flex;align-items:center;justify-content:space-around;color:#e8dcc0">
    <button type="button" aria-label="Phone" style="background:none;border:0;color:inherit;padding:10px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A15 15 0 0 1 4 5a1 1 0 0 1 1-1z"/></svg></button>
    <button type="button" aria-label="Camera" style="background:none;border:0;color:inherit;padding:10px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button type="button" aria-label="Web" style="background:none;border:0;color:inherit;padding:10px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></button>
    <button type="button" aria-label="Settings" style="background:none;border:0;color:inherit;padding:10px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></button>
  </div>
</div>
</div>

</body>
</html>
