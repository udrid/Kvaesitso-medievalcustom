<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Scriptorium home screen</title>

</head>
<body>
<div>
<div>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
.row{width:100%;display:flex;align-items:center;gap:14px;background:none;border:0;border-bottom:1.5px dashed #6b5636;padding:11px 0;color:#20170f;text-align:left}
.seal{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a23a28,#6e2417);border:2px solid #4c180f;display:flex;align-items:center;justify-content:center;color:#ecdfc2;flex:none}
</style>
</div>
<div style="position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 46px),radial-gradient(120% 70% at 50% 0%,#2d2f34 0%,#17181b 72%);font-family:'IM Fell English',Georgia,serif;color:#e8dcc0">

  <!-- camera island -->
  <div style="position:absolute;top:10px;left:50%;transform:translateX(-50%);width:214px;height:36px;box-sizing:border-box;border-radius:18px;background:#050506;border:1.5px solid #5a5f67;display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;column-gap:8px;padding:0 14px;font-size:12px">
    <span style="display:flex;align-items:center;gap:5px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e58a3c" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg>Ready</span>
    <span style="width:14px;height:14px;border-radius:50%;background:#101114;border:2px solid #2a2c31"></span>
    <span style="text-align:right">77%</span>
  </div>

  <!-- parchment sheet -->
  <div style="position:absolute;top:66px;left:14px;right:14px;height:620px;box-sizing:border-box;border:2px solid #4a4e55;border-radius:6px;background:linear-gradient(170deg,#e0cfa6,#c9b585);box-shadow:0 4px 0 #0b0b0d,inset 0 0 40px rgba(90,60,20,.35);padding:22px 24px;color:#20170f">
    <div style="display:flex;align-items:baseline;justify-content:space-between">
      <div style="font-family:Cinzel,serif;font-size:12px;letter-spacing:.22em;color:#4a3a24">SUNDAY · 25 OCTOBER</div>
      <div style="font-family:Cinzel,serif;font-size:20px;font-weight:700">2:04</div>
    </div>
    <div style="font-size:34px;font-style:italic;line-height:1.1;margin-top:14px">What shall<br>we write today?</div>

    <!-- quill bar -->
    <div style="display:flex;align-items:center;gap:10px;margin-top:20px;height:48px;box-sizing:border-box;border:1.5px solid #5b4a30;border-radius:4px;background:rgba(32,23,15,.08);padding:0 14px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#20170f" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M20 4c-9 0-14 5-14 12l-2 4 4-2c7 0 12-5 12-14z"/><path d="M8 16c3-4 6-7 9-9"/></svg>
      <span style="font-size:17px;font-style:italic;color:#4a3a24">Write to Claude…</span>
    </div>

    <div style="font-family:Cinzel,serif;font-size:11px;letter-spacing:.24em;color:#4a3a24;margin:22px 0 4px">CONTENTS</div>

    <button type="button" class="row"><span class="seal"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg></span><span style="font-size:23px;flex:1">Claude</span><span style="font-style:italic;font-size:15px;color:#4a3a24">the Oracle</span></button>
    <button type="button" class="row"><span class="seal"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 14c3-1 5-3 6-6 2 1 4 1 6 0l5 3-4 1c0 4-3 7-8 7H6l2-3-5-2z"/></svg></span><span style="font-size:23px;flex:1">Twitter</span><span style="font-style:italic;font-size:15px;color:#4a3a24">the Raven</span></button>
    <button type="button" class="row"><span class="seal"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6 7h9v10a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V7z"/><path d="M15 9h2a2 2 0 0 1 0 5h-2"/></svg></span><span style="font-size:23px;flex:1">Discord</span><span style="font-style:italic;font-size:15px;color:#4a3a24">the Tavern</span></button>
    <button type="button" class="row"><span class="seal"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg></span><span style="font-size:23px;flex:1">Videos</span><span style="font-style:italic;font-size:15px;color:#4a3a24">the Scrying Glass</span></button>
    <button type="button" class="row" style="border-bottom:0"><span class="seal"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg></span><span style="font-size:23px;flex:1">Messages</span><span style="font-style:italic;font-size:15px;color:#4a3a24">the Courier</span></button>
  </div>

  <!-- dock -->
  <div style="position:absolute;left:20px;right:20px;bottom:22px;height:84px;box-sizing:border-box;border:2px solid #4a4e55;border-radius:14px;background:linear-gradient(180deg,#26282c,#131416);box-shadow:inset 0 0 0 1px #0b0b0d;display:flex;align-items:center;justify-content:space-around;color:#e8dcc0">
    <button type="button" aria-label="Phone" style="background:none;border:0;color:inherit;padding:10px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A15 15 0 0 1 4 5a1 1 0 0 1 1-1z"/></svg></button>
    <button type="button" aria-label="Camera" style="background:none;border:0;color:inherit;padding:10px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button type="button" aria-label="Web" style="background:none;border:0;color:inherit;padding:10px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></button>
    <button type="button" aria-label="Settings" style="background:none;border:0;color:inherit;padding:10px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></button>
  </div>
</div>
</div>

</body>
</html>
