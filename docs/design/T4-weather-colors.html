<!doctype html><html><head><meta charset="utf-8"><title>T4 weather colours</title>
<style>
@font-face{font-family:Cinzel;src:url("../../app/ui/src/main/res/font/cinzel_variable.ttf");font-weight:400 900}
@font-face{font-family:"IM Fell English";src:url("../../app/ui/src/main/res/font/imfellenglish_italic.ttf");font-style:italic}
body{margin:0;width:390px;background:#0d0c09;color:#a8884c;font-family:Cinzel,serif}
table{border-collapse:separate;border-spacing:4px 3px;margin:6px 4px}
th{font-size:9px;font-weight:700;letter-spacing:.18em;color:#c9a55a;padding:8px 0 2px;text-align:center}
th small{display:block;font-family:'IM Fell English',serif;font-style:italic;font-weight:400;letter-spacing:0;font-size:9.5px;color:#8c7a52;margin-top:2px}
td.n{font-size:7px;letter-spacing:.12em;color:#6b5a38;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;width:9px}
td.s{background:radial-gradient(90% 120% at 50% 40%,#26211a 0%,#0d0c09 90%);border:1px solid #3a2e18}
td.s svg{display:block}
.hd{display:flex;gap:4px;margin:4px 8px 14px 17px}
.hd>div{flex:1;text-align:right;padding:6px 6px 4px;background:radial-gradient(90% 120% at 50% 40%,#26211a 0%,#0d0c09 90%);border:1px solid #3a2e18}
.hd .t{font-family:serif;font-size:18px;color:#f2e6c6;line-height:1}
.hd .w{font-family:'IM Fell English',serif;font-style:italic;font-size:9px;color:#a8987a;margin:3px 0 2px}
.cap{font-size:8.5px;letter-spacing:.2em;color:#8c6d3a;margin:10px 17px 0}
</style></head><body>
<div id="g"></div>
<script src="T4-weather.js"></script>
<script>
var L={clear:'Clear',clearnight:'Night',partly:'Partly',cloudy:'Cloudy',rain:'Rain',storm:'Storm',snow:'Snow',fog:'Fog'};
var P=[['accent','A. Weather only','gold land, coloured weather'],['pigment','B. Manuscript','muted inks, tinted sky'],['vivid','C. Vivid','brighter inks and sky']];
var h='<table><tr><th></th>'+P.map(function(p){return '<th>'+p[1]+'<small>'+p[2]+'</small></th>'}).join('')+'</tr>';
WX.names.forEach(function(k){h+='<tr><td class="n">'+L[k]+'</td>'+P.map(function(p){return '<td class="s">'+WX.svg(k,112,46,p[0])+'</td>'}).join('')+'</tr>'});
h+='</table><div class="cap">AT REAL SIZE, UNDER THE TIME (RAIN)</div><div class="hd">'+P.map(function(p){return '<div><div class="t">10:36</div><div class="w">51° · Rain</div>'+WX.svg('rain',64,26,p[0])+'</div>'}).join('')+'</div>';
document.getElementById('g').innerHTML=h;
/* freeze at a moment where the storm bolt and every frame set are visible */
document.getAnimations().forEach(function(a){a.pause();a.currentTime=850});
</script></body></html>
